name: Build site

# Builds the whole website and uploads it as the `site` artifact, laid out the
# way it is served:
#   /        the main site (this repo's files outside the blog submodule)
#   /blog/   the `blog` submodule built into a static website (pre-rendered
#            HTML, no client-side markdown rendering)
# Used by deploy.yaml, and can be run by hand to check a build.

on:
  workflow_call:
    inputs:
      ref:
        description: "Commit of this repo to build (default: the triggering commit)"
        type: string
        default: ""
  workflow_dispatch:
  pull_request:

env:
  SITE_URL: https://leonllr.ch # public origin (social-media tags, sitemaps)
  SITE_PREFIX: /blog # URL the blog is served under
  IMAGE_HOST: https://llrblog.vercel.app # blog images stay on Vercel

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}
          submodules: recursive
          fetch-depth: 0 # file dates for the main site's sitemap

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: .github/scripts/package-lock.json

      - name: Install build dependencies
        run: npm ci --prefix .github/scripts

      # Point blog image links to Vercel and make the other paths work under /blog/.
      # Only touches the runner's working copy: nothing is committed or pushed.
      # Routing is skipped: the static build writes real pages at the pretty URLs.
      - name: Rewrite blog links (images to Vercel, paths under /blog/)
        env:
          SKIP_ROUTING: 1
        run: bash ./.github/scripts/rewrite-image-links.sh blog "$IMAGE_HOST" "$SITE_PREFIX"

      - name: Build static site
        run: node .github/scripts/build-blog.mjs blog "dist$SITE_PREFIX" --base "$SITE_PREFIX" --site-url "$SITE_URL"

      # Everything else in this repo (main page, contact, images...) goes to the
      # site root, plus the root sitemap index (main pages + blog) and robots.txt.
      - name: Add main site
        run: |
          node .github/scripts/build-site-root.mjs dist --site-url "$SITE_URL"
          cat dist/sitemap.xml dist/robots.txt

      - uses: actions/upload-artifact@v4
        with:
          name: site
          path: dist/
          include-hidden-files: true # .htaccess
          if-no-files-found: error
          retention-days: 7
