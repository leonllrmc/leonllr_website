name: Deploy to Infomaniak

on:
  push:
  workflow_dispatch:
  # called by update-blog.yaml after it bumped the blog submodule
  workflow_call:
    inputs:
      ref:
        description: "Commit of this repo to deploy (default: the triggering commit)"
        type: string
        default: ""

jobs:
  build:
    uses: ./.github/workflows/build-blog.yaml
    with:
      ref: ${{ inputs.ref }}

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment: secrets
    # never run two uploads at once (dangerous-clean-slate wipes the server)
    concurrency:
      group: deploy-infomaniak
      cancel-in-progress: false

    steps:
      - uses: actions/download-artifact@v4
        with:
          name: site
          path: dist

      - name: Deploy dist dir
        uses: SamKirkland/FTP-Deploy-Action@4.0.0
        with:
          server: h2park-8d750cc5.infomaniak.ch
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          server-dir: /
          local-dir: ./dist/
          dangerous-clean-slate: true
          # Images are served by Vercel now, so don't upload them.
          # This action version (4.0.0) only understands the [a, b, c] list format,
          # and setting `exclude` replaces the defaults, hence the first three patterns.
          exclude: "[**/.git*, **/.git*/**, **/node_modules/**, blog/projects/*/img/**]"
