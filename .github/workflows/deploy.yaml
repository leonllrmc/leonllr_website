name: Deploy to Infomaniak

on: [push]

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: secrets

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      # Point every image link in the blog submodule to the Vercel hosting.
      # Only touches the runner's working copy: nothing is committed or pushed.
      - name: Redirect blog image links to llrblog.vercel.app
        run: bash ./.github/scripts/rewrite-image-links.sh blog https://llrblog.vercel.app

      - name: Deploy dist dir
        uses: SamKirkland/FTP-Deploy-Action@4.0.0
        with:
          server: h2park-8d750cc5.infomaniak.ch
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          server-dir: /
          local-dir: ./
          dangerous-clean-slate: true
          # Optional: images are now served by Vercel, so skip uploading them.
          # Setting `exclude` replaces the action's defaults, hence the first three lines.
          exclude: |
            **/.git*
            **/.git*/**
            **/node_modules/**
            blog/projects/*/img/**