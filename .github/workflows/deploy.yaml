name: Deploy to Infomaniak

on: [push]

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: secrets

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      # Point blog image links to Vercel and make the other paths work under /blog/.
      # Only touches the runner's working copy: nothing is committed or pushed.
      - name: Rewrite blog links (images to llrblog.vercel.app, paths under /blog/)
        run: bash ./.github/scripts/rewrite-image-links.sh blog https://llrblog.vercel.app /blog

      - name: Deploy dist dir
        uses: SamKirkland/FTP-Deploy-Action@4.0.0
        with:
          server: h2park-8d750cc5.infomaniak.ch
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          server-dir: /
          local-dir: ./
          dangerous-clean-slate: true
          # Images are served by Vercel now, so don't upload them.
          # This action version (4.0.0) only understands the [a, b, c] list format,
          # and setting `exclude` replaces the defaults, hence the first three patterns.
          exclude: "[**/.git*, **/.git*/**, **/node_modules/**, blog/projects/*/img/**]"